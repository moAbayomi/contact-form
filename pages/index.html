<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<title>contact form</title>

		<style type="text/tailwindcss">
			@theme {
                 
                
			}

            @font-face {
                font-family: "Karla";
                src: url("./fonts/static/Karla-Regular.ttf");
                font-weight: 400;
                font-display: swap;
            }

		</style>
	</head>
	<body class="w-screen">
		<div class="wrapper mx-auto max-w-360">
			<main class="w-full p-6 flex flex-col gap-6">
				<h1 class="text-3xl">Contact Us</h1>

				<form action="/" method="POST" class="flex flex-col gap-6">
					<div class="flex flex-col md:flex-row gap-4">
						<div class="flex-1 flex flex-col gap-2">
							<label for="first-name" class="text-xl">First Name</label>
							<input
								required
								type="text"
								name="first-name"
								id="first-name"
								class="border-1 rounded-sm h-12" />
						</div>

						<div class="flex-1 flex flex-col gap-2">
							<label for="last-name" class="text-xl">Last Name</label>
							<input
								required
								type="text"
								id="last-name"
								name="last-name"
								class="border-1 rounded-sm h-12" />
						</div>
					</div>

					<div class="flex flex-col gap-2">
						<label for="email" class="text-xl">Email Address</label>
						<input
							required
							class="border-1 rounded-sm h-12"
							type="email"
							id="email"
							name="email" />
					</div>

					<div class="flex flex-col gap-2">
						<label for="query-type">Query Type</label>
						<div class="flex flex-col md:flex-row gap-4">
							<div
								class="flex-1 flex items-center p-4 px-4 gap-2 border-1 rounded-sm h-12">
								<input
									type="radio"
									name="query-type"
									id="general-enquiry"
									value="general-enquiry"
									class="w-6 h-6" />
								<label for="general-enquiry" class="text-xl"
									>General enquiry</label
								>
							</div>
							<div
								class="flex-1 flex items-center p-4 px-4 gap-2 border-1 rounded-sm h-12">
								<input
									type="radio"
									name="query-type"
									id="support-request"
									value="support-request"
									class="w-6 h-6" />
								<label for="support-request" class="text-xl"
									>Support Request</label
								>
							</div>
						</div>
					</div>

					<div class="flex flex-col gap-2">
						<label for="message" class="text-xl">Message</label>
						<textarea
							required
							name="message"
							id="message"
							rows="5"
							cols="15"
							class="outline-none border-1 p-4"></textarea>
					</div>

					<div>
						<input type="checkbox" name="consent" id="consent" value="agreed" />
						<label for="consent"
							>I consent to being consented by the team.</label
						>
					</div>
					<div class="flex">
						<input type="submit" value="Submit" class="flex-1 bg-green-600 py-4 cursor-pointer" />
					</div>
				</form>
			</main>
		</div>
	</body>
</html>
